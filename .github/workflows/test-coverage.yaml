
name: Coverage

on:
  pull_request:
    types:
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - master
  release:
    types: [published]
  workflow_dispatch:

permissions: read-all

jobs:
  coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    concurrency:
      group: coverage-${{ github.event_name != 'pull_request' || github.run_id }}

    permissions:
      contents: write

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            github::munoztd0/covr2
            any::DT
            any::htmltools

      - name: Generate report and badge
        run: |
          dir.create("cov-out", showWarnings = FALSE, recursive = TRUE)

          stopifnot(
            requireNamespace("covr2", quietly = TRUE),
            requireNamespace("DT", quietly = TRUE),
            requireNamespace("htmltools", quietly = TRUE)
          )

          cov <- covr2::package_coverage(
            path = ".",
            quiet = FALSE,
            clean = FALSE
          )

          covr2::report(
            cov,
            file = "cov-out/index.html",
            browse = FALSE
          )

          pct <- round(covr2::percent_coverage(cov), 1)

          if (is.na(pct)) {
            badge_value <- "NA"
            color <- "lightgrey"
          } else {
            badge_value <- sprintf("%.1f%%25", pct)
            color <- if (pct >= 90) {
              "brightgreen"
            } else if (pct >= 80) {
              "yellow"
            } else if (pct >= 70) {
              "orange"
            } else {
              "red"
            }
          }

          url <- sprintf(
            "https://img.shields.io/badge/coverage-%s-%s.svg",
            badge_value,
            color
          )

          download.file(
            url,
            destfile = "cov-out/coverage-badge.svg",
            mode = "wb"
          )

          message("Coverage: ", pct, "%")
          message("Report: cov-out/index.html")
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: cov-out
          target-folder: coverage
